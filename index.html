<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Будешь моей валентинкой? ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(to right, #ff758c, #ff7eb3);
        overflow: hidden;
        color: white;
    }

    h1 {
        margin-top: 80px;
        font-size: 40px;
    }
    
    img {
        width: 300px;
        border-radius: 20px;
        margin: 20px 0;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        background-color: white;
        padding: 10px;
    }
    
    #questionSection img {
        width: 300px;
        border-radius: 20px;
        margin: 20px 0;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        background-color: white; /* ensures solid background */
        padding: 10px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }


    #heart {
        font-size: 60px;
        position: absolute;
        cursor: pointer;
        transition: left 0.3s ease, top 0.3s ease;
    }


    #questionSection {
        display: none;
        margin-top: 100px;
    }

    button {
        padding: 15px 35px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        margin: 20px;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
    }

    #yesBtn:hover {
        transform: scale(1.1);
    }

    #noBtn {
        background-color: #444;
        color: white;
        position: absolute;
    }

    #celebration {
        display: none;
        margin-top: 120px;
    }
</style>
</head>

<body>

<h1 id="gameTitle">Поймай сердечко 3 раза ❤️</h1>

<div id="heart">❤️</div>

<div id="questionSection">
    <h1>Будешь моей валентинкой? 💘</h1>
    <img src="us.webp">
    <button id="yesBtn">Да 💖</button>
    <button id="noBtn">Нет 😢</button>
</div>

<div id="celebration">
    <h1>Ураааа! Ты со мной навсегда! 🎉💘</h1>
    <img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" width="300">
</div>

<script>
const heart = document.getElementById("heart");
const gameTitle = document.getElementById("gameTitle");
const questionSection = document.getElementById("questionSection");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const celebration = document.getElementById("celebration");

let count = 0;

// Move heart randomly
function moveHeart() {
    const x = Math.random() * (window.innerWidth - 60);
    const y = Math.random() * (window.innerHeight - 60);
    heart.style.left = x + "px";
    heart.style.top = y + "px";
}

// Initial position
moveHeart();

// When heart clicked
heart.addEventListener("click", function() {
    count++;
    heart.style.transform = "scale(1.3)";
    setTimeout(()=>{heart.style.transform="scale(1)";}, 200);
    if (count < 3) {
        moveHeart();
    } else {
        heart.style.display = "none";
        gameTitle.style.display = "none";
        questionSection.style.display = "block";
    }
});;

// Make NO button run away
noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// YES button click
yesBtn.addEventListener("click", function() {
    questionSection.style.display = "none";
    celebration.style.display = "block";
});
    
// Confetti effect when YES is clicked
function createConfetti() {
    for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.innerHTML = '🎊';
        confetti.style.position = 'absolute';
        confetti.style.fontSize = Math.random() * 24 + 12 + 'px';
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.top = '-50px';
        confetti.style.opacity = Math.random();
        confetti.style.transition = 'top 3s linear, opacity 3s linear';
        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.style.top = window.innerHeight + 'px';
            confetti.style.opacity = 0;
        }, 100);

        setTimeout(() => {
            confetti.remove();
        }, 3100);
    }
}

// Trigger confetti on YES click
yesBtn.addEventListener("click", function() {
    questionSection.style.display = "none";
    celebration.style.display = "block";
    createConfetti();
});

</script>

</body>
</html>
